<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="920" height="330" fill="#ffffff"/>

  <text x="48" y="30" font-size="15" font-weight="700" fill="#0f172a">Anti-diagonal drain — which PEs are read out and cleared on each beat</text>
  <text x="48" y="52" font-size="12.5" fill="#475569">A PE is tapped when <tspan font-size="12.5" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#b45309">(row + col) mod 4 == select_index</tspan>. The counter advances one step per beat.</text>

  <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2">
    <rect x="48" y="90" width="36" height="36" rx="4"/><rect x="86" y="90" width="36" height="36" rx="4"/><rect x="124" y="90" width="36" height="36" rx="4"/><rect x="162" y="90" width="36" height="36" rx="4"/>
    <rect x="48" y="128" width="36" height="36" rx="4"/><rect x="86" y="128" width="36" height="36" rx="4"/><rect x="124" y="128" width="36" height="36" rx="4"/><rect x="162" y="128" width="36" height="36" rx="4"/>
    <rect x="48" y="166" width="36" height="36" rx="4"/><rect x="86" y="166" width="36" height="36" rx="4"/><rect x="124" y="166" width="36" height="36" rx="4"/><rect x="162" y="166" width="36" height="36" rx="4"/>
    <rect x="48" y="204" width="36" height="36" rx="4"/><rect x="86" y="204" width="36" height="36" rx="4"/><rect x="124" y="204" width="36" height="36" rx="4"/><rect x="162" y="204" width="36" height="36" rx="4"/>

    <rect x="273" y="90" width="36" height="36" rx="4"/><rect x="311" y="90" width="36" height="36" rx="4"/><rect x="349" y="90" width="36" height="36" rx="4"/><rect x="387" y="90" width="36" height="36" rx="4"/>
    <rect x="273" y="128" width="36" height="36" rx="4"/><rect x="311" y="128" width="36" height="36" rx="4"/><rect x="349" y="128" width="36" height="36" rx="4"/><rect x="387" y="128" width="36" height="36" rx="4"/>
    <rect x="273" y="166" width="36" height="36" rx="4"/><rect x="311" y="166" width="36" height="36" rx="4"/><rect x="349" y="166" width="36" height="36" rx="4"/><rect x="387" y="166" width="36" height="36" rx="4"/>
    <rect x="273" y="204" width="36" height="36" rx="4"/><rect x="311" y="204" width="36" height="36" rx="4"/><rect x="349" y="204" width="36" height="36" rx="4"/><rect x="387" y="204" width="36" height="36" rx="4"/>

    <rect x="498" y="90" width="36" height="36" rx="4"/><rect x="536" y="90" width="36" height="36" rx="4"/><rect x="574" y="90" width="36" height="36" rx="4"/><rect x="612" y="90" width="36" height="36" rx="4"/>
    <rect x="498" y="128" width="36" height="36" rx="4"/><rect x="536" y="128" width="36" height="36" rx="4"/><rect x="574" y="128" width="36" height="36" rx="4"/><rect x="612" y="128" width="36" height="36" rx="4"/>
    <rect x="498" y="166" width="36" height="36" rx="4"/><rect x="536" y="166" width="36" height="36" rx="4"/><rect x="574" y="166" width="36" height="36" rx="4"/><rect x="612" y="166" width="36" height="36" rx="4"/>
    <rect x="498" y="204" width="36" height="36" rx="4"/><rect x="536" y="204" width="36" height="36" rx="4"/><rect x="574" y="204" width="36" height="36" rx="4"/><rect x="612" y="204" width="36" height="36" rx="4"/>

    <rect x="723" y="90" width="36" height="36" rx="4"/><rect x="761" y="90" width="36" height="36" rx="4"/><rect x="799" y="90" width="36" height="36" rx="4"/><rect x="837" y="90" width="36" height="36" rx="4"/>
    <rect x="723" y="128" width="36" height="36" rx="4"/><rect x="761" y="128" width="36" height="36" rx="4"/><rect x="799" y="128" width="36" height="36" rx="4"/><rect x="837" y="128" width="36" height="36" rx="4"/>
    <rect x="723" y="166" width="36" height="36" rx="4"/><rect x="761" y="166" width="36" height="36" rx="4"/><rect x="799" y="166" width="36" height="36" rx="4"/><rect x="837" y="166" width="36" height="36" rx="4"/>
    <rect x="723" y="204" width="36" height="36" rx="4"/><rect x="761" y="204" width="36" height="36" rx="4"/><rect x="799" y="204" width="36" height="36" rx="4"/><rect x="837" y="204" width="36" height="36" rx="4"/>
  </g>

  <!-- tapped PEs: (row + col) mod 4 == select -->
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1.6">
    <rect x="48"  y="90"  width="36" height="36" rx="4"/><rect x="162" y="128" width="36" height="36" rx="4"/>
    <rect x="124" y="166" width="36" height="36" rx="4"/><rect x="86"  y="204" width="36" height="36" rx="4"/>

    <rect x="311" y="90"  width="36" height="36" rx="4"/><rect x="273" y="128" width="36" height="36" rx="4"/>
    <rect x="387" y="166" width="36" height="36" rx="4"/><rect x="349" y="204" width="36" height="36" rx="4"/>

    <rect x="574" y="90"  width="36" height="36" rx="4"/><rect x="536" y="128" width="36" height="36" rx="4"/>
    <rect x="498" y="166" width="36" height="36" rx="4"/><rect x="612" y="204" width="36" height="36" rx="4"/>

    <rect x="837" y="90"  width="36" height="36" rx="4"/><rect x="799" y="128" width="36" height="36" rx="4"/>
    <rect x="761" y="166" width="36" height="36" rx="4"/><rect x="723" y="204" width="36" height="36" rx="4"/>
  </g>

  <g font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="66"  y="113" fill="#ffffff" font-weight="700">00</text><text x="104" y="113" fill="#94a3b8">01</text><text x="142" y="113" fill="#94a3b8">02</text><text x="180" y="113" fill="#94a3b8">03</text>
    <text x="66"  y="151" fill="#94a3b8">10</text><text x="104" y="151" fill="#94a3b8">11</text><text x="142" y="151" fill="#94a3b8">12</text><text x="180" y="151" fill="#ffffff" font-weight="700">13</text>
    <text x="66"  y="189" fill="#94a3b8">20</text><text x="104" y="189" fill="#94a3b8">21</text><text x="142" y="189" fill="#ffffff" font-weight="700">22</text><text x="180" y="189" fill="#94a3b8">23</text>
    <text x="66"  y="227" fill="#94a3b8">30</text><text x="104" y="227" fill="#ffffff" font-weight="700">31</text><text x="142" y="227" fill="#94a3b8">32</text><text x="180" y="227" fill="#94a3b8">33</text>

    <text x="291" y="113" fill="#94a3b8">00</text><text x="329" y="113" fill="#ffffff" font-weight="700">01</text><text x="367" y="113" fill="#94a3b8">02</text><text x="405" y="113" fill="#94a3b8">03</text>
    <text x="291" y="151" fill="#ffffff" font-weight="700">10</text><text x="329" y="151" fill="#94a3b8">11</text><text x="367" y="151" fill="#94a3b8">12</text><text x="405" y="151" fill="#94a3b8">13</text>
    <text x="291" y="189" fill="#94a3b8">20</text><text x="329" y="189" fill="#94a3b8">21</text><text x="367" y="189" fill="#94a3b8">22</text><text x="405" y="189" fill="#ffffff" font-weight="700">23</text>
    <text x="291" y="227" fill="#94a3b8">30</text><text x="329" y="227" fill="#94a3b8">31</text><text x="367" y="227" fill="#ffffff" font-weight="700">32</text><text x="405" y="227" fill="#94a3b8">33</text>

    <text x="516" y="113" fill="#94a3b8">00</text><text x="554" y="113" fill="#94a3b8">01</text><text x="592" y="113" fill="#ffffff" font-weight="700">02</text><text x="630" y="113" fill="#94a3b8">03</text>
    <text x="516" y="151" fill="#94a3b8">10</text><text x="554" y="151" fill="#ffffff" font-weight="700">11</text><text x="592" y="151" fill="#94a3b8">12</text><text x="630" y="151" fill="#94a3b8">13</text>
    <text x="516" y="189" fill="#ffffff" font-weight="700">20</text><text x="554" y="189" fill="#94a3b8">21</text><text x="592" y="189" fill="#94a3b8">22</text><text x="630" y="189" fill="#94a3b8">23</text>
    <text x="516" y="227" fill="#94a3b8">30</text><text x="554" y="227" fill="#94a3b8">31</text><text x="592" y="227" fill="#94a3b8">32</text><text x="630" y="227" fill="#ffffff" font-weight="700">33</text>

    <text x="741" y="113" fill="#94a3b8">00</text><text x="779" y="113" fill="#94a3b8">01</text><text x="817" y="113" fill="#94a3b8">02</text><text x="855" y="113" fill="#ffffff" font-weight="700">03</text>
    <text x="741" y="151" fill="#94a3b8">10</text><text x="779" y="151" fill="#94a3b8">11</text><text x="817" y="151" fill="#ffffff" font-weight="700">12</text><text x="855" y="151" fill="#94a3b8">13</text>
    <text x="741" y="189" fill="#94a3b8">20</text><text x="779" y="189" fill="#ffffff" font-weight="700">21</text><text x="817" y="189" fill="#94a3b8">22</text><text x="855" y="189" fill="#94a3b8">23</text>
    <text x="741" y="227" fill="#ffffff" font-weight="700">30</text><text x="779" y="227" fill="#94a3b8">31</text><text x="817" y="227" fill="#94a3b8">32</text><text x="855" y="227" fill="#94a3b8">33</text>
  </g>

  <g font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#334155" text-anchor="middle">
    <text x="124" y="80">select = 0</text>
    <text x="349" y="80">select = 1</text>
    <text x="574" y="80">select = 2</text>
    <text x="799" y="80">select = 3</text>
  </g>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="124" y="262">beat N</text>
    <text x="349" y="262">beat N+1</text>
    <text x="574" y="262">beat N+2</text>
    <text x="799" y="262">beat N+3</text>
  </g>

  <text x="48" y="298" font-size="12.5" fill="#475569">Each tapped PE is read into the output buffer and zeroed in the same beat, so it begins accumulating the next matrix</text>
  <text x="48" y="316" font-size="12.5" fill="#475569">immediately. With all four diagonals rotating, matrix pairs stream back-to-back with no pipeline bubble.</text>
</svg>
