# Tiny Tapeout project information
project:
  title:        "4x4 TPU"      # Project title
  author:       "Albert Huang, Matthew Kong, Jiya Nair, Rivera Wijaya"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "4x4 Matrix multiplier for neural network processing"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     33000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_4x4TPU"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_4x4TPU.v"
    - "control_fsm.v"
    - "IO_Interface.v"
    - "PE.v"
    - "ReLU.v"
    - "systolic_array_fsm.sv"
    - "systolic_array_mux.sv"
    - "systolic_array.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "matA_bit0"
  ui[1]: "matA_bit1"
  ui[2]: "matA_bit2"
  ui[3]: "matA_bit3"
  ui[4]: "matA_bit4"
  ui[5]: "matA_bit5"
  ui[6]: "matB_bit0"
  ui[7]: "matB_bit1"

  # Outputs
  uo[0]: "out_bit0"
  uo[1]: "out_bit1"
  uo[2]: "out_bit2"
  uo[3]: "out_bit3"
  uo[4]: "out_bit4"
  uo[5]: "out_bit5"
  uo[6]: "out_bit6"
  uo[7]: "out_bit7"

  # Bidirectional pins
  uio[0]: "matB_bit2"
  uio[1]: "matB_bit3"
  uio[2]: "matB_bit4"
  uio[3]: "matB_bit5"
  uio[4]: "out_bit8"
  uio[5]: "out_bit9"
  uio[6]: "out_bit10"
  uio[7]: "out_bit11"

# Do not change!
yaml_version: 6
